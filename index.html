<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HYPERSPINS 9999 // GLITCH WHEEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       HYPERPOP x CYBERPUNK x GLITCHCORE STYLES
       ========================================== */
    :root {
      --bg-color: #05020a;
      --hyper-pink: #ff007f;
      --cyber-violet: #9d00ff;
      --acid-green: #00ff66;
      --neon-yellow: #ffe600;
      --electric-cyan: #00f3ff;
      --pure-black: #000000;
      --font-display: 'Dela Gothic One', cursive, sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: var(--font-mono);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* CRT & Scanline Overlay */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
    }

    .bg-grid {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(to right, rgba(157, 0, 255, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(157, 0, 255, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: 0;
    }

    /* Container */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Header */
    .cyber-header {
      text-align: center;
      margin-top: 8px;
    }

    .status-badge {
      font-size: 11px;
      color: var(--acid-green);
      background: #000;
      border: 1px solid var(--acid-green);
      display: inline-block;
      padding: 2px 8px;
      margin-bottom: 4px;
      box-shadow: 2px 2px 0px var(--acid-green);
    }

    .blink {
      animation: blinkAnim 0.8s infinite alternate;
    }

    @keyframes blinkAnim {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .glitch-title {
      font-family: var(--font-display);
      font-size: 32px;
      color: var(--neon-yellow);
      text-shadow: 3px 3px 0px var(--hyper-pink), -2px -2px 0px var(--electric-cyan);
      position: relative;
      letter-spacing: 1px;
    }

    .cyber-sub {
      font-size: 12px;
      color: var(--electric-cyan);
      letter-spacing: 2px;
    }

    /* Wheel Stage */
    .wheel-stage {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pointer-wrapper {
      position: absolute;
      top: 0;
      z-index: 20;
      font-size: 32px;
      color: var(--neon-yellow);
      filter: drop-shadow(0px 0px 8px var(--hyper-pink));
      animation: pulsePointer 0.6s infinite alternate;
    }

    @keyframes pulsePointer {
      from { transform: translateY(0); }
      to { transform: translateY(4px); }
    }

    .wheel-outer-ring {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 4px solid var(--pure-black);
      box-shadow: 
        0 0 0 4px var(--hyper-pink),
        0 0 15px var(--cyber-violet),
        inset 0 0 15px rgba(0,0,0,0.8);
      background: var(--pure-black);
      overflow: hidden;
      position: relative;
    }

    #wheelCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Spin Button */
    .spin-btn {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--neon-yellow);
      border: 4px solid var(--pure-black);
      box-shadow: 4px 4px 0px var(--hyper-pink);
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--pure-black);
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s;
    }

    .spin-btn:active {
      transform: translateX(-50%) scale(0.95);
      box-shadow: 1px 1px 0px var(--hyper-pink);
    }

    .spin-btn .btn-glitch { display: none; }

    .spin-btn.spinning {
      background: var(--hyper-pink);
      color: #fff;
      animation: btnGlitch 0.2s infinite;
    }

    @keyframes btnGlitch {
      0% { transform: translateX(-52%) skewX(5deg); }
      50% { transform: translateX(-48%) skewX(-5deg); }
      100% { transform: translateX(-50%); }
    }

    /* Action Bar & Buttons */
    .action-bar {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .cyber-btn {
      flex: 1;
      padding: 10px;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 13px;
      border: 2px solid var(--pure-black);
      background: #222;
      color: #fff;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--pure-black);
      text-transform: uppercase;
    }

    .cyber-btn.pink { background: var(--hyper-pink); color: #fff; box-shadow: 3px 3px 0px var(--electric-cyan); }
    .cyber-btn.yellow { background: var(--neon-yellow); color: #000; box-shadow: 3px 3px 0px var(--hyper-pink); }
    .cyber-btn.green { background: var(--acid-green); color: #000; box-shadow: 3px 3px 0px var(--cyber-violet); }

    .cyber-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--pure-black) !important;
    }

    /* History Section */
    .history-section {
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid var(--electric-cyan);
      padding: 12px;
      box-shadow: 4px 4px 0px var(--cyber-violet);
    }

    .section-title {
      font-size: 13px;
      color: var(--electric-cyan);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--electric-cyan);
      padding-bottom: 4px;
    }

    .history-list {
      list-style: none;
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      font-size: 12px;
      background: #120824;
      padding: 4px 8px;
      border-left: 3px solid var(--acid-green);
      display: flex;
      justify-content: space-between;
    }

    .empty-log {
      font-size: 12px;
      color: #666;
      text-align: center;
      padding: 8px;
    }

    /* Modal System */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 2, 10, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: #0d061a;
      border: 3px solid var(--hyper-pink);
      box-shadow: 6px 6px 0px var(--neon-yellow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--hyper-pink);
      padding-bottom: 8px;
    }

    .modal-header h2 {
      font-size: 16px;
      color: var(--neon-yellow);
      font-family: var(--font-display);
    }

    .close-btn {
      background: var(--hyper-pink);
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 2px 8px;
      cursor: pointer;
    }

    .preset-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #222;
      border: 1px solid var(--electric-cyan);
      color: var(--electric-cyan);
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .input-add-group {
      display: flex;
      gap: 6px;
    }

    .input-add-group input {
      flex: 1;
      background: #000;
      border: 2px solid var(--electric-cyan);
      color: #fff;
      padding: 6px 8px;
      font-family: var(--font-mono);
      outline: none;
    }

    .items-editor-list {
      max-height: 180px;
      overflow-y: auto;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .editor-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a0033;
      padding: 6px 10px;
      border: 1px solid var(--cyber-violet);
      font-size: 13px;
    }

    .del-item-btn {
      background: transparent;
      border: none;
      color: var(--hyper-pink);
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    /* Win Modal Specifics */
    .win-box {
      text-align: center;
      border-color: var(--acid-green);
      box-shadow: 6px 6px 0px var(--hyper-pink);
      animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popWin {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .glitch-banner {
      background: var(--acid-green);
      color: #000;
      font-weight: bold;
      font-size: 12px;
      padding: 2px;
      letter-spacing: 2px;
    }

    .win-label { font-size: 12px; color: #aaa; margin-top: 8px; }

    .win-result-text {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--neon-yellow);
      text-shadow: 3px 3px 0px var(--hyper-pink);
      word-break: break-all;
      margin: 12px 0;
    }

    .win-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Confetti Canvas Layer */
    #particleCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <!-- CRT Scanline Effect Overlay -->
  <div class="crt-overlay"></div>

  <!-- Background Glitch Shapes -->
  <div class="bg-grid"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="cyber-header">
      <div class="status-badge"><span class="blink">●</span> LIVE_NODE_99</div>
      <h1 class="glitch-title" data-text="HYPER★SPIN">HYPER★SPIN</h1>
      <p class="cyber-sub">LUCKY_WHEEL_SYS_V2.0</p>
    </header>

    <!-- Lucky Wheel Stage -->
    <main class="wheel-stage">
      <div class="pointer-wrapper">
        <div class="pointer">▼</div>
      </div>
      <div class="wheel-outer-ring">
        <canvas id="wheelCanvas" width="340" height="340"></canvas>
      </div>
      <button id="spinBtn" class="spin-btn">
        <span class="btn-text">SPIN!</span>
        <span class="btn-glitch">SP1N!</span>
      </button>
    </main>

    <!-- Controls & Actions -->
    <div class="action-bar">
      <button id="openConfigBtn" class="cyber-btn pink">⚙ CONFIG_ITEMS</button>
      <button id="toggleAudioBtn" class="cyber-btn yellow">🔊 SFX: ON</button>
    </div>

    <!-- History Panel -->
    <section class="history-section">
      <h3 class="section-title">LOGS_HISTORY [ <span id="historyCount">0</span> ]</h3>
      <ul id="historyList" class="history-list">
        <li class="empty-log">NO DATA IN BUFFER...</li>
      </ul>
    </section>
  </div>

  <!-- Item Config Drawer / Modal -->
  <div id="configModal" class="modal-backdrop hidden">
    <div class="modal-box cyber-border">
      <div class="modal-header">
        <h2>ITEM_CONFIG_MATRIX</h2>
        <button id="closeConfigBtn" class="close-btn">✕</button>
      </div>
      <div class="preset-group">
        <span>PRESETS:</span>
        <button class="preset-btn" data-preset="default">預設獎項</button>
        <button class="preset-btn" data-preset="food">宵夜指南</button>
        <button class="preset-btn" data-preset="punish">派對懲罰</button>
        <button class="preset-btn" data-preset="number">幸運數字</button>
      </div>
      <div class="input-add-group">
        <input type="text" id="newItemInput" placeholder="輸入新獎項..." maxlength="15" />
        <button id="addItemBtn" class="cyber-btn green">+ ADD</button>
      </div>
      <ul id="itemsList" class="items-editor-list"></ul>
    </div>
  </div>

  <!-- Win Result Modal -->
  <div id="winModal" class="modal-backdrop hidden">
    <div class="modal-box cyber-border win-box">
      <div class="glitch-banner">SYSTEM_OVERRIDE</div>
      <p class="win-label">WINNER DETECTED // 抽中結果</p>
      <h1 id="winResultText" class="win-result-text">---</h1>
      <div class="win-actions">
        <button id="claimWinBtn" class="cyber-btn green">ACCEPT (接受)</button>
      </div>
    </div>
  </div>

  <!-- Particle Layer for Canvas Confetti -->
  <canvas id="particleCanvas"></canvas>

  <script>
    /* ==========================================
       HYPERSPINS 9999 - ENGINE & INTERACT
       ========================================== */

    // 6 個指定獎項
    let items = ["手機", "鈔票", "奔馳", "金條", "大金勞", "沒中"];

    // 機率權重：沒中 95%，其餘 5 個大獎各 1%
    let itemWeights = [1, 1, 1, 1, 1, 95];

    const colors = ['#ff007f', '#9d00ff', '#00ff66', '#ffe600', '#00f3ff', '#ff3300'];

    const presets = {
      default: ["手機", "鈔票", "奔馳", "金條", "大金勞", "沒中"],
      food: ['拉麵', '炸雞', '麻辣鍋', '超商便當', '手搖飲', '絕食一餐'],
      punish: ['深蹲 30 下', '大聲唱歌', '喝苦茶', '模仿梗圖', '傳訊息給前任', '免罰pass'],
      number: ['100pt', '50pt', '20pt', '銘謝惠顧', '雙倍積分', '0pt']
    };

    let startAngle = 0;
    let isSpinning = false;
    let audioEnabled = true;
    let audioCtx = null;
    let lastSectorIndex = -1;

    // --- DOM Elements ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const openConfigBtn = document.getElementById('openConfigBtn');
    const closeConfigBtn = document.getElementById('closeConfigBtn');
    const configModal = document.getElementById('configModal');
    const itemsList = document.getElementById('itemsList');
    const newItemInput = document.getElementById('newItemInput');
    const addItemBtn = document.getElementById('addItemBtn');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const winModal = document.getElementById('winModal');
    const winResultText = document.getElementById('winResultText');
    const claimWinBtn = document.getElementById('claimWinBtn');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    let historyLogs = [];

    // --- Web Audio API Synthesizer ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      if (!audioEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound() {
      if (!audioEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.1, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.15);
      });
    }

    // --- Wheel Drawing Logic ---
    function drawWheel() {
      const numItems = items.length;
      if (numItems === 0) return;
      
      const arc = (2 * Math.PI) / numItems;
      const outsideRadius = 160;
      const textRadius = 110;
      const insideRadius = 35;

      ctx.clearRect(0, 0, 340, 340);

      for (let i = 0; i < numItems; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];

        ctx.beginPath();
        ctx.arc(170, 170, outsideRadius, angle, angle + arc, false);
        ctx.arc(170, 170, insideRadius, angle + arc, angle, true);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px "Share Tech Mono", monospace';
        ctx.translate(
          170 + Math.cos(angle + arc / 2) * textRadius,
          170 + Math.sin(angle + arc / 2) * textRadius
        );
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = items[i];
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
      }
    }

    // --- Weighted Random Calculation ---
    function getWeightedRandomIndex() {
      if (items.length !== itemWeights.length) {
        return Math.floor(Math.random() * items.length);
      }

      const totalWeight = itemWeights.reduce((acc, w) => acc + w, 0);
      let randomNum = Math.random() * totalWeight;

      for (let i = 0; i < itemWeights.length; i++) {
        if (randomNum < itemWeights[i]) {
          return i;
        }
        randomNum -= itemWeights[i];
      }
      return items.length - 1;
    }

    // --- Physics Spin Mechanics ---
    let spinTimeout = null;
    let currentStep = 0;
    let totalSteps = 0;
    let initialAngle = 0;
    let totalRotationAngle = 0;
    let winningIndex = -1;

    function spin() {
      if (isSpinning || items.length === 0) return;
      initAudio();
      isSpinning = true;
      spinBtn.classList.add('spinning');

      winningIndex = getWeightedRandomIndex();

      const numItems = items.length;
      const arc = (2 * Math.PI) / numItems;
      const randomSectorOffset = (Math.random() * 0.6 + 0.2) * arc;
      
      const targetAngleInSector = (1.5 * Math.PI) - (winningIndex * arc + randomSectorOffset);
      const extraRounds = Math.floor(Math.random() * 4 + 5) * (2 * Math.PI);
      
      initialAngle = startAngle % (2 * Math.PI);
      let targetAngle = targetAngleInSector + extraRounds;
      
      while (targetAngle < initialAngle) {
        targetAngle += 2 * Math.PI;
      }
      
      totalRotationAngle = targetAngle - initialAngle;
      currentStep = 0;
      totalSteps = Math.floor(Math.random() * 80 + 180);

      rotateWheel();
    }

    function rotateWheel() {
      currentStep++;
      if (currentStep >= totalSteps) {
        stopRotateWheel();
        return;
      }

      const progress = currentStep / totalSteps;
      const easeOut = 1 - Math.pow(1 - progress, 5);
      
      startAngle = initialAngle + totalRotationAngle * easeOut;
      drawWheel();

      const numItems = items.length;
      const arc = (2 * Math.PI) / numItems;
      const normalizedAngle = (2 * Math.PI - (startAngle % (2 * Math.PI))) % (2 * Math.PI);
      const currentSector = Math.floor(((normalizedAngle + 1.5 * Math.PI) % (2 * Math.PI)) / arc);
      
      if (currentSector !== lastSectorIndex) {
        playTickSound();
        lastSectorIndex = currentSector;
      }

      spinTimeout = requestAnimationFrame(rotateWheel);
    }

    function stopRotateWheel() {
      isSpinning = false;
      spinBtn.classList.remove('spinning');
      
      const winningItem = items[winningIndex];
      triggerWin(winningItem);
    }

    // --- Win Modal & Particles ---
    function triggerWin(result) {
      playWinSound();
      winResultText.innerText = result;
      winModal.classList.remove('hidden');
      
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      historyLogs.unshift({ time, result });
      renderHistory();
      
      triggerConfetti();
    }

    function renderHistory() {
      historyCount.innerText = historyLogs.length;
      if (historyLogs.length === 0) {
        historyList.innerHTML = `<li class="empty-log">NO DATA IN BUFFER...</li>`;
        return;
      }
      historyList.innerHTML = historyLogs.map(log => `
        <li class="history-item">
          <span>${log.result}</span>
          <span style="color:#888">${log.time}</span>
        </li>
      `).join('');
    }

    // --- Item Config Handlers ---
    function renderEditorItems() {
      itemsList.innerHTML = items.map((item, idx) => `
        <li class="editor-item">
          <span>${idx + 1}. ${item} (${itemWeights[idx] || 1}%)</span>
          <button class="del-item-btn" onclick="removeItem(${idx})">✖</button>
        </li>
      `).join('');
      drawWheel();
    }

    window.removeItem = function(index) {
      if (items.length <= 2) {
        alert("SYSTEM ERROR: 最少需要 2 個選項！");
        return;
      }
      items.splice(index, 1);
      itemWeights.splice(index, 1);
      renderEditorItems();
    };

    addItemBtn.addEventListener('click', () => {
      const val = newItemInput.value.trim();
      if (val) {
        items.push(val);
        itemWeights.push(1);
        newItemInput.value = '';
        renderEditorItems();
      }
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const key = e.target.dataset.preset;
        if (presets[key]) {
          items = [...presets[key]];
          itemWeights = items.map(() => 1);
          renderEditorItems();
        }
      });
    });

    // --- Modal Controls ---
    openConfigBtn.addEventListener('click', () => configModal.classList.remove('hidden'));
    closeConfigBtn.addEventListener('click', () => configModal.classList.add('hidden'));

    claimWinBtn.addEventListener('click', () => winModal.classList.add('hidden'));

    toggleAudioBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      toggleAudioBtn.innerText = audioEnabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
      toggleAudioBtn.style.opacity = audioEnabled ? '1' : '0.5';
    });

    spinBtn.addEventListener('click', spin);

    // --- Particle Glitch Confetti ---
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];

    function resizeParticleCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeParticleCanvas);
    resizeParticleCanvas();

    function triggerConfetti() {
      particles = [];
      const pColors = ['#ff007f', '#9d00ff', '#00ff66', '#ffe600', '#00f3ff'];
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.5) * 16 - 4,
          size: Math.random() * 8 + 4,
          color: pColors[Math.floor(Math.random() * pColors.length)],
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015
        });
      }
      animateParticles();
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= p.decay;

        if (p.life > 0) {
          pCtx.fillStyle = p.color;
          pCtx.globalAlpha = p.life;
          pCtx.fillRect(p.x, p.y, p.size, p.size);
        } else {
          particles.splice(i, 1);
        }
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateParticles);
      }
    }

    // Initialization
    renderEditorItems();
  </script>
</body>
</html>
